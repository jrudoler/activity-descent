[project]
name = "adescent"
version = "0.1.0"
description = "Reproducible simulations for activity-space kernel descent"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "snakemake>=9.0",
]

[project.optional-dependencies]
gpu = [
    "torch==2.11.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
